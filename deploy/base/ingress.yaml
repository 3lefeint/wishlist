apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wishlist
spec:
  ingressClassName: public
  rules:
    - host: wishlist.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wishlist
                port:
                  name: http
